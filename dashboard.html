<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Stasis Solutions — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050505;
    --panel: #0e0f0e;
    --border: #1f231f;
    --white: #f5f6f5;
    --muted: #83897f;
    --green: #35e07a;
    --green-dim: #1f7a45;
    --radius: 6px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--white);
    min-height: 100%;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 18px;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(53,224,122,0.05), transparent 40%),
      radial-gradient(circle at 85% 95%, rgba(53,224,122,0.04), transparent 45%);
  }

  .card {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .prompt {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--green-dim);
    letter-spacing: 0.02em;
    margin: 0 0 10px;
  }

  .prompt::before { content: "$ "; color: var(--green); }

  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: clamp(22px, 6vw, 28px);
    margin: 0 0 8px;
  }

  h1 .name { color: var(--green); }

  .sub {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 30px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 22px;
    text-align: left;
  }

  .row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .row:last-child { border-bottom: none; }
  .row span:first-child { color: var(--muted); }

  button {
    width: 100%;
    padding: 14px 16px;
    margin-top: 24px;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--white);
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  button:hover, button:focus-visible {
    border-color: var(--green-dim);
    color: var(--green);
    outline: none;
  }

  .disclosure {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #4a504a;
    text-align: center;
    margin-top: 22px;
    line-height: 1.6;
  }
</style>
</head>
<body>

  <div class="card">
    <p class="prompt">stasis-solutions --session</p>
    <h1>Welcome, <span class="name" id="user-name">there</span></h1>
    <p class="sub">You're signed in.</p>

    <div class="panel">
      <div class="row"><span>Email</span><span id="user-email">—</span></div>
      <div class="row"><span>Signed in</span><span id="user-since">—</span></div>
    </div>

    <button id="logout-btn">Log out</button>
    <p class="disclosure"># demo auth — accounts are stored only in this browser</p>
  </div>

<script>
(function () {
  const USERS_KEY = 'stasisUsers';
  const SESSION_KEY = 'stasisSession';

  function getSession() {
    try {
      return JSON.parse(localStorage.getItem(SESSION_KEY))
        || JSON.parse(sessionStorage.getItem(SESSION_KEY));
    } catch (e) {
      return null;
    }
  }

  function getUsers() {
    try {
      return JSON.parse(localStorage.getItem(USERS_KEY)) || {};
    } catch (e) {
      return {};
    }
  }

  const session = getSession();
  if (!session) {
    window.location.href = 'index.html';
    return;
  }

  const users = getUsers();
  const user = users[session.email];

  document.getElementById('user-name').textContent = user ? user.name : session.email;
  document.getElementById('user-email').textContent = session.email;
  document.getElementById('user-since').textContent = new Date(session.loggedInAt).toLocaleString();

  document.getElementById('logout-btn').addEventListener('click', function () {
    localStorage.removeItem(SESSION_KEY);
    sessionStorage.removeItem(SESSION_KEY);
    window.location.href = 'index.html';
  });
})();
</script>

</body>
</html>
