<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in to your Verizon business account</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #F5F0E8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1A1A1A;
    display: flex;
    justify-content: center;
    padding: 32px 16px 80px;
  }

  .page {
    width: 100%;
    max-width: 430px;
  }

  .card {
    background: #FFFFFF;
    border-radius: 22px;
    padding: 40px 32px 44px;
    margin-bottom: 40px;
  }

  h1.title {
    color: #CD040B;
    font-size: 42px;
    font-weight: 500;
    margin: 0 0 18px;
    line-height: 1.1;
  }

  .subtitle {
    font-size: 21px;
    margin: 0 0 40px;
    color: #1A1A1A;
  }

  label.field-label {
    display: block;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 10px;
  }

  input[type="text"] {
    width: 100%;
    padding: 16px 16px;
    font-size: 17px;
    border: 1.5px solid #A6A6A6;
    border-radius: 6px;
    outline: none;
    font-family: inherit;
    background: #fff;
  }

  input[type="text"]:focus {
    border-color: #000;
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 26px 0 26px;
  }

  .checkbox-row input[type="checkbox"] {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1.5px solid #767676;
    appearance: none;
    -webkit-appearance: none;
    background: #fff;
    cursor: pointer;
    margin: 0;
  }

  .checkbox-row label {
    font-size: 20px;
    color: #1A1A1A;
    cursor: pointer;
  }

  a.text-link {
    color: #1A1A1A;
    text-decoration: underline;
    font-size: 20px;
  }

  .forgot-id {
    display: block;
    margin-bottom: 36px;
  }

  button.continue-btn {
    width: 100%;
    padding: 18px;
    font-size: 19px;
    font-weight: 700;
    border: none;
    border-radius: 32px;
    background: #D6D6D6;
    color: #FFFFFF;
    cursor: not-allowed;
    font-family: inherit;
  }

  button.continue-btn.active {
    background: #0F6FDE;
    cursor: pointer;
  }

  .below-card {
    padding: 0 8px;
  }

  .need-access {
    font-size: 20px;
    margin-bottom: 26px;
    color: #1A1A1A;
  }

  .need-access strong {
    font-weight: 800;
  }

  .need-access .chev {
    font-weight: 800;
  }

  .resend {
    display: block;
    margin-bottom: 40px;
  }

  h2.quick-links {
    font-size: 30px;
    font-weight: 800;
    margin: 0 0 14px;
  }

  hr.divider {
    border: none;
    border-top: 2px solid #1A1A1A;
    margin: 0 0 28px;
  }

  .quick-link-item {
    display: block;
    font-size: 20px;
    margin-bottom: 26px;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1 class="title">Log in</h1>
      <p class="subtitle">to your Verizon business account</p>

      <label class="field-label" for="userid">User ID</label>
      <input type="text" id="userid" name="userid" autocomplete="username" oninput="handleUserIdInput()">

      <div class="checkbox-row">
        <input type="checkbox" id="remember">
        <label for="remember">Remember User ID</label>
      </div>

      <a href="#" class="text-link forgot-id">I forgot my User ID</a>

      <button type="button" id="continueBtn" class="continue-btn" onclick="handleContinueClick()">Continue</button>
    </div>

    <div class="below-card">
      <p class="need-access">Need access? <strong>Register for an account</strong> <span class="chev">&rsaquo;</span></p>

      <a href="#" class="text-link resend">Resend welcome email</a>

      <h2 class="quick-links">Quick Links</h2>
      <hr class="divider">

      <a href="#" class="text-link quick-link-item">Pay without logging in</a>
      <a href="#" class="text-link quick-link-item">Create a billing inquiry</a>
      <a href="#" class="text-link quick-link-item">Check billing inquiry status</a>
    </div>
  </div>

  <script>
    function handleUserIdInput() {
      var input = document.getElementById('userid');
      var btn = document.getElementById('continueBtn');
      if (input.value.trim().length > 0) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    }

    function handleContinueClick() {
      var btn = document.getElementById('continueBtn');
      if (btn.classList.contains('active')) {
        window.location.href = 'verizon-password.html';
      }
    }
  </script>
</body>
</html>
