<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#EEF1EE">
<meta name="color-scheme" content="light">
<title>Analyze Property</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
    :root {
        --color-bg: #EEF1EE;
        --color-bg-desktop: #E2E6E2;
        --color-surface: #FFFFFF;
        --color-ink: #171B1A;
        --color-ink-muted: #666E6A;
        --color-accent: #0D9488;
        --color-accent-ink: #FFFFFF;
        --color-line: rgba(23, 27, 26, 0.08);
        --radius-lg: 24px;
        --radius-sm: 12px;
        --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }

    body {
        background: var(--color-bg-desktop);
        color: var(--color-ink);
        font-family: var(--font-body);
        overscroll-behavior: none;
        display: flex;
        justify-content: center;
    }

    /* App shell: full-bleed on phones, centered "device" card on wider screens */
    .app {
        width: 100%;
        min-height: 100dvh;
        background: var(--color-bg);
        display: flex;
        flex-direction: column;
        position: relative;
    }

    @media (min-width: 560px) {
        body { padding: 40px 20px; align-items: flex-start; }
        .app {
            max-width: 420px;
            min-height: calc(100dvh - 80px);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(15, 20, 18, 0.18), 0 0 0 1px var(--color-line);
        }
    }

    /* ---------- Image scene ---------- */
    .scene {
        position: relative;
        flex: 0 0 54%;
        min-height: 260px;
        overflow: hidden;
        background: #1C2320;
    }

    .scene-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    /* Graceful stand-in if the image asset isn't present alongside this file */
    .scene-placeholder {
        display: none;
        position: absolute;
        inset: 0;
        align-items: center;
        justify-content: center;
        background:
            repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 28px),
            repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 28px),
            #232B27;
    }

    .scene.no-image .scene-image { display: none; }
    .scene.no-image .scene-placeholder { display: flex; }

    .scene-placeholder svg { width: 34px; height: 34px; color: var(--color-accent); opacity: 0.9; }

    .scene-scrim {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 64px;
        background: linear-gradient(to bottom, rgba(28,35,32,0) 0%, var(--color-surface) 100%);
        pointer-events: none;
    }

    .location-chip {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 16px);
        left: 16px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.92);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        padding: 8px 14px 8px 10px;
        border-radius: 999px;
        box-shadow: 0 4px 14px rgba(15, 20, 18, 0.14);
    }

    .location-chip svg { width: 16px; height: 16px; color: var(--color-accent); flex-shrink: 0; }

    .location-chip span {
        font-size: 0.8125rem;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: var(--color-ink);
    }

    /* ---------- Action sheet ---------- */
    .sheet {
        position: relative;
        z-index: 2;
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--color-surface);
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        margin-top: -20px;
        padding: 28px 24px calc(22px + env(safe-area-inset-bottom, 0px));
    }

    .sheet h1 {
        font-family: var(--font-display);
        font-size: 1.375rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.25;
        margin-bottom: 10px;
    }

    .sheet p {
        font-size: 0.9375rem;
        line-height: 1.5;
        color: var(--color-ink-muted);
        max-width: 34ch;
    }

    .sheet-footer { margin-top: auto; padding-top: 28px; }

    button.run {
        width: 100%;
        padding: 16px;
        background: var(--color-accent);
        color: var(--color-accent-ink);
        font-family: var(--font-body);
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        border: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
        transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button.run:hover { opacity: 0.92; }
    button.run:active { transform: scale(0.98); }
    button.run:disabled { opacity: 0.55; cursor: not-allowed; }
    button.run:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 3px; }

    /* ---------- Loading overlay ---------- */
    #loadingOverlay {
        position: absolute;
        inset: 0;
        display: none;
        justify-content: center;
        align-items: center;
        background: rgba(238, 241, 238, 0.96);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        z-index: 10;
        padding: 24px;
        text-align: center;
    }

    .radar {
        position: relative;
        width: 88px;
        height: 88px;
        margin: 0 auto 24px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .radar-ring {
        position: absolute;
        inset: 0;
        border: 2px solid var(--color-accent);
        border-radius: 50%;
        opacity: 0;
        animation: pulse-ring 2.1s ease-out infinite;
    }

    .radar-ring:nth-child(2) { animation-delay: 0.7s; }
    .radar-ring:nth-child(3) { animation-delay: 1.4s; }

    .radar-pin {
        position: relative;
        z-index: 1;
        width: 30px;
        height: 30px;
        color: var(--color-accent);
    }

    @keyframes pulse-ring {
        0%   { transform: scale(0.35); opacity: 0.9; }
        100% { transform: scale(1.6); opacity: 0; }
    }

    .loading-title {
        font-family: var(--font-display);
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-bottom: 6px;
    }

    .loading-sub {
        font-size: 0.875rem;
        color: var(--color-ink-muted);
    }

    @media (prefers-reduced-motion: reduce) {
        .radar-ring { animation: none; opacity: 0.5; }
        button.run { transition: none; }
    }
</style>
</head>
<body>

<div class="app">

    <div class="scene" id="scene">
        <img
            id="sceneImage"
            class="scene-image"
            src="pinpoint sat.png"
            alt="Satellite view of selected residential addresses"
            onerror="handleImageError()"
        >
        <div class="scene-placeholder" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="currentColor"/>
                <circle cx="12" cy="9" r="2.5" fill="#232B27"/>
            </svg>
        </div>
        <div class="scene-scrim"></div>
        <div class="location-chip">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="currentColor"/>
                <circle cx="12" cy="9" r="2.5" fill="var(--color-surface)"/>
            </svg>
            <span>Selected property</span>
        </div>
    </div>

    <div class="sheet">
        <h1>Analyze these leads</h1>
        <p>Generate ownership report.</p>
        <div class="sheet-footer">
            <button class="run" type="button" id="runButton" onclick="executeAnalysis()">Run analysis</button>
        </div>
    </div>

    <div id="loadingOverlay" role="status" aria-live="polite">
        <div>
            <div class="radar">
                <div class="radar-ring"></div>
                <div class="radar-ring"></div>
                <div class="radar-ring"></div>
                <svg class="radar-pin" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="currentColor"/>
                    <circle cx="12" cy="9" r="2.5" fill="var(--color-bg)"/>
                </svg>
            </div>
            <p class="loading-title">Running analysis</p>
            <p class="loading-sub">Gathering ownership information.&hellip;</p>
        </div>
    </div>

</div>

<script>
    function handleImageError() {
        document.getElementById('scene').classList.add('no-image');
    }

    function executeAnalysis() {
        var button = document.getElementById('runButton');
        button.disabled = true;

        // 1. Show the loading overlay
        document.getElementById('loadingOverlay').style.display = 'flex';

        // 2. Wait 12 seconds, then redirect to the results page
        //    Ensure your third page file is named exactly 'results.html'
        //    and is in the same folder as this one.
        setTimeout(function () {
            window.location.href = 'results.html';
        }, 12000);
    }
</script>

</body>
</html>
